[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-graph-agents"
version = "0.1.0"
description = "Team-of-agents architecture for HPC graph analytics on Arkouda/Arachne"
authors = [{name = "Asha Saxena"}, {name = "David A. Bader"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["loom*"]
